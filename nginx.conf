server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        # 2026-08-28: Tailscale 리모트 머신을 1대에서 2대로 늘리면서 api를 별도 머신으로 뺐다 -
        # 더는 같은 docker-compose 네트워크의 "api" 서비스명으로 못 찾는다(DNS 아님, 고정 IP).
        proxy_pass http://100.69.13.90:8080/api/;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
